services:
  # Servicio Proxy oficial para conectar a Cloud SQL en GCP
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
    container_name: cloud_sql_proxy
    user: root
    restart: always
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "apicuatroreinas:southamerica-west1:bd4reinas"
    volumes:
      - ~/.config/gcloud:/config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/config/gcloud/application_default_credentials.json
    ports:
      - "5433:5432" # Expuesto a la máquina host (ej. para DBeaver, pg_dump, etc.)

  # db:
  #   image: postgres:16
  #   container_name: postgres_db
  #   restart: always
  #   environment:
  #     POSTGRES_DB: postgres
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: 8mEYrnGT3eu
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d bd4reinas"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  backend:
    build: ./backend
    container_name: django_backend
    image: joseveloso/ecommerce_apicultura-backend:v1
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cloud-sql-proxy
    environment:
      - DEBUG=1
      # Conexión a GCP Cloud SQL (vía el contenedor cloud-sql-proxy)
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=8mEYrnGT3eu
      - DB_HOST=cloud-sql-proxy
      - DB_PORT=5432
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      
      # Conexión local (Descomentar para usar base de datos Docker local)
      # - DB_NAME=ecommerce
      # - DB_USER=admin
      # - DB_PASSWORD=admin123
      # - DB_HOST=db
      # - DB_PORT=5432
      # - DATABASE_URL=postgres://admin:admin123@db:5432/ecommerce
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173

  frontend:
    build: 
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    
    environment:
      #- VITE_API_URL=https://backend-337307900667.southamerica-west1.run.app
      - VITE_API_URL=http://localhost:8080

    depends_on:
      - backend

