# version: '3.9'

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: bd4reinas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8mEYrnGT3eu
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd4reinas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: django_backend
    image: joseveloso/ecommerce_apicultura-backend:v1
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=1
      # Conexión a GCP Cloud SQL (vía Proxy local en puerto 5433)
      - DB_NAME=bd4reinas
      - DB_USER=postgres
      - DB_PASSWORD=8mEYrnGT3eu
      - DB_HOST=/cloudsql/apicuatroreinas:southamerica-west1:bd4reinas
      - DB_PORT=5433
      # Conexión local (Descomentar para usar base de datos Docker local)
      # - DB_NAME=ecommerce
      # - DB_USER=admin
      # - DB_PASSWORD=admin123
      # - DB_HOST=db
      # - DB_PORT=5432
      # - DATABASE_URL=postgres://admin:admin123@db:5432/ecommerce
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173


  frontend:
    build: 
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    
    # environment:
    #   - VITE_API_URL=http://backend:8000
    # Se remueve VITE_API_URL para permitir que Vite lea el archivo frontend/.env
    
    depends_on:
      - backend

volumes:
  pgdata:
